<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #faf8ef;
    color: #776e65;
    font-family: "Segoe UI", "Microsoft JhengHei", Arial, sans-serif;
  }
  .container { width: min(480px, 100vw - 32px); margin-top: 32px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 64px; margin: 0; color: #776e65; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: #bbada0; color: #fff; border-radius: 6px;
    padding: 6px 16px; text-align: center; min-width: 72px;
  }
  .score-box .label { font-size: 12px; color: #eee4da; text-transform: uppercase; }
  .score-box .value { font-size: 22px; font-weight: bold; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  button {
    background: #8f7a66; color: #f9f6f2; border: none; border-radius: 6px;
    padding: 10px 18px; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  button:hover { background: #9f8b77; }

  .board-wrap { position: relative; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 12px;
    background: #bbada0;
    border-radius: 8px;
    aspect-ratio: 1;
    touch-action: none;
    user-select: none;
  }
  .cell { background: rgba(238, 228, 218, 0.35); border-radius: 6px; }
  /* 方塊層：與棋盤內容區重疊，方塊以 transform 定位並滑動 */
  .tile-layer { position: absolute; inset: 12px; pointer-events: none; }
  .tile {
    position: absolute; top: 0; left: 0;
    width: calc((100% - 36px) / 4);
    height: calc((100% - 36px) / 4);
    /* 百分比以方塊自身尺寸計算：每格位移 = 方塊寬 + 間距 12px */
    transform: translate(calc(var(--c) * (100% + 12px)), calc(var(--r) * (100% + 12px)));
    transition: transform calc(var(--anim, 120) * 1ms) ease-in-out;
    z-index: 1;
  }
  .tile.merged-away { z-index: 0; }
  .tile-inner {
    width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;
    border-radius: 6px; font-weight: bold;
    font-size: clamp(20px, 8vw, 48px);
  }
  /* 出現、合併動畫隨動畫時間等比縮放（預設 120ms → 約 0.2s） */
  .tile-inner.new { animation: appear calc(var(--anim, 120) * 1.6ms) ease; }
  .tile-inner.merged { animation: pop calc(var(--anim, 120) * 1.6ms) ease; position: relative; z-index: 1; }
  @keyframes appear { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

  .t2    { background: #eee4da; color: #776e65; }
  .t4    { background: #ede0c8; color: #776e65; }
  .t8    { background: #f2b179; color: #f9f6f2; }
  .t16   { background: #f59563; color: #f9f6f2; }
  .t32   { background: #f67c5f; color: #f9f6f2; }
  .t64   { background: #f65e3b; color: #f9f6f2; }
  .t128  { background: #edcf72; color: #f9f6f2; font-size: clamp(18px, 7vw, 40px); }
  .t256  { background: #edcc61; color: #f9f6f2; font-size: clamp(18px, 7vw, 40px); }
  .t512  { background: #edc850; color: #f9f6f2; font-size: clamp(18px, 7vw, 40px); }
  .t1024 { background: #edc53f; color: #f9f6f2; font-size: clamp(14px, 5.5vw, 32px); }
  .t2048 { background: #edc22e; color: #f9f6f2; font-size: clamp(14px, 5.5vw, 32px); }
  .tsuper { background: #3c3a32; color: #f9f6f2; font-size: clamp(12px, 4.5vw, 26px); }

  .overlay {
    position: absolute; inset: 0; z-index: 10; /* 需高於方塊（.tile z-index: 1） */
    display: none; flex-direction: column; justify-content: center; align-items: center; gap: 16px;
    background: rgba(238, 228, 218, 0.75); border-radius: 8px;
  }
  .overlay.show { display: flex; animation: appear 0.3s ease; }
  .overlay p { font-size: 48px; font-weight: bold; margin: 0; }
  .overlay .buttons { display: flex; gap: 8px; }
  .tip { margin-top: 16px; line-height: 1.6; }

  .ai-panel { margin-top: 16px; background: #eee4da; border-radius: 8px; padding: 12px 16px; }
  .ai-buttons { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ai-buttons button.running { background: #f65e3b; }
  #aiStatus { margin-left: auto; font-weight: bold; }
  .ai-panel summary { margin-top: 12px; cursor: pointer; font-weight: bold; }
  .param {
    display: grid; grid-template-columns: 10rem 1fr 3.5em;
    align-items: center; gap: 8px; margin-top: 8px;
  }
  .param input { width: 100%; accent-color: #8f7a66; }
  .param .val { text-align: right; font-variant-numeric: tabular-nums; }
  .param-hint { font-size: 12px; color: #9a8f86; margin: 2px 0 0 calc(10rem + 8px); }

  .bar-actions { display: flex; gap: 8px; align-items: center; }
  #langSelect {
    padding: 8px; border-radius: 6px; border: none;
    background: #eee4da; color: #776e65; font-size: 14px; cursor: pointer;
  }
  /* 勝利提示：不阻擋操作，顯示幾秒後自動淡出 */
  .win-toast {
    position: absolute; top: 50%; left: 50%; z-index: 5;
    transform: translate(-50%, -50%);
    padding: 16px 32px; border-radius: 8px;
    background: rgba(237, 194, 46, 0.92); color: #f9f6f2;
    font-size: 40px; font-weight: bold; white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity 0.4s;
  }
  .win-toast.show { opacity: 1; }
  #resetParams { margin-top: 12px; padding: 6px 12px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="label" data-i18n="score"></div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label" data-i18n="best"></div><div class="value" id="best">0</div></div>
    </div>
  </header>
  <div class="bar">
    <span data-i18n-html="intro"></span>
    <div class="bar-actions">
      <select id="langSelect" aria-label="Language"></select>
      <button id="newGame" data-i18n="newGame"></button>
    </div>
  </div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="tile-layer" id="tileLayer"></div>
    <div class="win-toast" id="winToast" data-i18n="win"></div>
    <div class="overlay" id="overlay">
      <p data-i18n="gameOver"></p>
      <button id="retryBtn" data-i18n="retry"></button>
    </div>
  </div>
  <div class="ai-panel">
    <div class="ai-buttons">
      <button id="aiToggle"></button>
      <button id="hintBtn" data-i18n="hint"></button>
      <span id="aiStatus"></span>
    </div>
    <details>
      <summary data-i18n="aiParams"></summary>
      <div id="params"></div>
      <button id="resetParams" data-i18n="reset"></button>
    </details>
  </div>
  <p class="tip" data-i18n-html="tip"></p>
</div>
<script src="i18n.js"></script>
<script src="ai.js"></script>
<script src="game.js"></script>
</body>
</html>
